name: "PR Second Opinion"
description: "Independent, agentic, OpenRouter-backed second-opinion review on a PR."
author: "storkme"
branding:
  icon: "eye"
  color: "purple"

inputs:
  openrouter-api-key:
    description: "OpenRouter API key (https://openrouter.ai/keys)."
    required: true
  github-token:
    description: "Token with pull-requests:write. Default: the workflow token."
    required: false
    default: ${{ github.token }}
  pr-number:
    description: "PR number to review. Default: the PR from the triggering event."
    required: false
    default: ${{ github.event.pull_request.number }}
  model:
    description: "OpenRouter model id for the review passes."
    required: false
    default: "deepseek/deepseek-v4-flash-0731"
  k:
    description: "Agentic passes to union. K=1 (default) skips the merge."
    required: false
    default: "1"
  merge-model:
    description: "OpenRouter model for the K>1 merge. Default: same as model."
    required: false
    default: ""
  project:
    description: "Project name used in the review prompt."
    required: false
    default: ${{ github.event.repository.name }}
  guidance-file:
    description: "Path (in the repo) to this project's review checklist / 'memory'."
    required: false
    default: ""
  exclude-globs:
    description: "Comma-separated globs to drop from the diff. Default: sensible set."
    required: false
    default: ""
  max-diff-chars:
    description: "Cap on the diff size sent to the model."
    required: false
    default: "60000"
  max-tokens:
    description: "Max completion tokens pi sends for a review pass. Leave empty for the
      provider-aware default (65536 on OpenRouter = deepseek-v4-flash-0731's cap; 32768 for
      local llama). A reasoning-capable model can exhaust a smaller budget in its reasoning
      channel and return an empty 200. Set only to override the provider default."
    required: false
    default: ""
  pass-timeout-seconds:
    description: "Per-pass timeout. Keep the calling job's timeout-minutes comfortably
      above this: if the job cap fires first it cancels mid-pass, skipping the degraded
      report entirely (no annotation, no failure notice) — strictly worse than a pass
      timeout."
    required: false
    default: "1800"
  max-pass-tokens:
    description: "Abort a pass once it exceeds this many tokens, reported as `runaway`
      rather than a timeout. A wall clock bounds time, not money — a looping agent can
      burn millions of tokens producing nothing, and a longer timeout only raises the
      bill. Empty (default) disables the ceiling."
    required: false
    default: ""
  max-pass-cost-usd:
    description: "Same, in USD. Prefer max-pass-tokens as the primary guard: this one
      depends on a price lookup, and a persistently failing lookup is deliberately left
      uncached (so a daemon retries), which means a cost-only ceiling degrades to a no-op
      while stalling each poll on the fetch. Empty (default) disables it."
    required: false
    default: ""
  session-dir:
    description: "Directory where pi writes its JSONL session transcripts. When set, each
      pass's full agent transcript is saved there (instead of pi's ephemeral --no-session
      mode) so a blocked or empty pass is forensically inspectable. Point it at a path you
      persist — e.g. a subdir of the runner workspace later uploaded as an artifact.
      Leave empty to keep the previous ephemeral behavior."
    required: false
    default: ""
  tools:
    description: "Agent tool grant. 'read,bash' (default) greps for callers/tests; set
      'read' to drop shell access on repos with untrusted PR authors. See README Security."
    required: false
    default: "read,bash"
  reasoning:
    description: "Whether the model is a reasoning model. Default true (the default
      deepseek-v4-flash-0731 is). Set false for a non-reasoning model so pi omits
      reasoning params."
    required: false
    default: "true"
  fail-on-degraded:
    description: "Fail the check (exit 2) when a pass degrades — times out, exits
      non-zero, or produces no review — and no review was posted. Surfaces reviewer
      malfunction, not review findings (a posted review always passes). Set 'false' for
      the old always-green behavior."
    required: false
    default: "true"
  loki-url:
    description: "Optional monitoring: a Loki push endpoint (e.g. a Grafana Cloud
      stack's https://logs-prod-XXX.grafana.net/loki/api/v1/push) that receives one
      structured JSON event per review/sweep — runtime, tokens, cost, outcome. Empty
      (default) disables metrics entirely; no network call is made. Fail-soft: a failed
      push never degrades or fails the review."
    required: false
    default: ""
  loki-user:
    description: "Basic-auth user for loki-url — on Grafana Cloud, the numeric Loki
      instance id. Leave empty for an unauthenticated (self-hosted) Loki."
    required: false
    default: ""
  loki-token:
    description: "Basic-auth password for loki-url — on Grafana Cloud, an access-policy
      token. Scope it to logs:write ONLY: the container also holds your other secrets,
      and a write-only token bounds the loss to garbage log lines (see README Security)."
    required: false
    default: ""

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    # No GITHUB_REPO here: the `github` context is NOT available in an action's runs.env
    # (only `inputs`/`env`/`runner`/`job`/`steps`/`strategy`/`matrix`). GitHub auto-provides
    # GITHUB_REPOSITORY in the container, and run.py falls back to it.
    PR_NUMBER: ${{ inputs.pr-number }}
    MODEL: ${{ inputs.model }}
    K: ${{ inputs.k }}
    MERGE_MODEL: ${{ inputs.merge-model }}
    PROJECT: ${{ inputs.project }}
    GUIDANCE_FILE: ${{ inputs.guidance-file }}
    EXCLUDE_GLOBS: ${{ inputs.exclude-globs }}
    MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
    PI_MAX_TOKENS: ${{ inputs.max-tokens }}
    PASS_TIMEOUT_S: ${{ inputs.pass-timeout-seconds }}
    MAX_PASS_TOKENS: ${{ inputs.max-pass-tokens }}
    MAX_PASS_COST_USD: ${{ inputs.max-pass-cost-usd }}
    PI_SESSION_DIR: ${{ inputs.session-dir }}
    TOOLS: ${{ inputs.tools }}
    PI_REASONING: ${{ inputs.reasoning }}
    FAIL_ON_DEGRADED: ${{ inputs.fail-on-degraded }}
    LOKI_URL: ${{ inputs.loki-url }}
    LOKI_USER: ${{ inputs.loki-user }}
    LOKI_TOKEN: ${{ inputs.loki-token }}
