# Drop this into any repo at .github/workflows/second-opinion.yml
# Add an OPENROUTER_API_KEY repo secret. That's the entire setup.
name: Second Opinion

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:                       # one run per PR; a new push cancels the old
  group: second-opinion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only, so secrets are never exposed to a fork. Dependabot PRs are
    # skipped too: they run against GitHub's separate Dependabot secret store, so the
    # key arrives empty and the job would fail on every dependency bump.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Must stay comfortably above the action's pass-timeout-seconds (default 1800s).
    # If the job cap fires first it cancels mid-pass, skipping the degraded report
    # entirely — no annotation, no failure notice — which is strictly worse than a
    # pass timeout. 40min leaves 600s of slack.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: storkme/second-opinion@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: deepseek/deepseek-v4-flash-0731
          guidance-file: .github/review-guidance.md   # optional: this repo's checklist
          # Optional spend ceiling. pass-timeout-seconds bounds TIME, not money — a
          # looping agent can burn millions of tokens producing nothing, and a longer
          # timeout only raises the bill. Off by default; set it once you know your
          # repo's normal range, and an over-ceiling pass reports as `runaway`.
          # max-pass-tokens: "5000000"
          # Optional runtime monitoring: one JSON event per review pushed to Loki
          # (Grafana Cloud or self-hosted). The reviewer runs unattended, so without
          # this its cost, duration, and degraded-rate are only visible by opening
          # individual run logs. Off unless loki-url is set — no URL, no network call.
          # URL and user are repo VARIABLES (neither is sensitive, and an unset var
          # expands to "" — a clean kill switch); only the token is a secret. Scope
          # that token to logs:write ONLY. Dashboard: examples/grafana-dashboard.json.
          # loki-url: ${{ vars.LOKI_URL }}
          # loki-user: ${{ vars.LOKI_USER }}
          # loki-token: ${{ secrets.LOKI_TOKEN }}
