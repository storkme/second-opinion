name: Second Opinion

# Dogfood: review our own PRs with this very reviewer, pinned to the released @v1.
# (To test unreleased reviewer changes, temporarily point this at @main or a branch.)
# Needs an OPENROUTER_API_KEY repo secret.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:                       # one run per PR; a new push cancels the old
  group: second-opinion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo, non-Dependabot PRs only. The fork guard keeps the key off untrusted
    # branches. The Dependabot guard is not about trust: Dependabot-triggered runs read
    # from GitHub's *separate* Dependabot secret store, so `secrets.OPENROUTER_API_KEY`
    # arrives empty and the job dies with "Missing required environment variable" — a
    # guaranteed red check on every dependency bump. Copying the key into that store
    # would fix the symptom by handing it to every automated bump run; a version-bump
    # diff is not worth a review anyway.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Must stay comfortably above the 1800s pass timeout below: if the job cap fires
    # first it cancels mid-pass, which skips the degraded path entirely — no annotation,
    # no failure notice, just a job-level kill — so a hit here is strictly worse than a
    # pass timeout. 40min leaves 600s of slack — the same margin every prior pairing here has
    # had (25min/900s, then 35min/1500s). Measured pre-pass overhead (container build + checkout) is ~30s across recent
    # runs — the action's image is rebuilt per run, and this Dockerfile builds in ~28s —
    # so 600s is ~20x the observed need and costs nothing when unused.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storkme/second-opinion@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          guidance-file: .github/review-guidance.md
          # This repo's own PRs outgrew the 900s default: an agentic pass on a large diff
          # with a reasoning model hits the wall and reds the check as degraded, with no
          # review — reviewer malfunction reported as if it were a verdict. Observed on
          # #21 (900s timeout) after two completed runs on the same PR burned 502k then
          # 923k tokens as the diff grew. A dogfood check that fails on its own medium
          # PRs teaches you to ignore it, which is the one thing this tripwire cannot
          # afford. This raises the ceiling, it does not remove it: a pass that genuinely
          # needs >1800s still reds the check as degraded, since the underlying cause (a
          # reasoning model outrunning the wall clock as the diff grows) is unaddressed.
          # If this trips again, the lever is the diff/prompt size or the model, not
          # another timeout bump.
          pass-timeout-seconds: "1800"
          # Keep the per-pass transcripts so a degraded pass is diagnosable after the
          # fact. Without this the session goes to a throwaway dir, gets read for the
          # cost footer, and is deleted — which is exactly what happened to the #29
          # runaway (12.6M tokens, $1.96, zero output): the numbers survived, the
          # evidence did not, so the loop it was stuck in is unrecoverable.
          # NOT a dotted path: upload-artifact@v4 excludes hidden files by default, so
          # `.second-opinion` uploads nothing while reporting success (learned the hard
          # way downstream).
          # Container path: the action is a docker action, and the runner workspace is
          # mounted at /github/workspace inside it. `${{ github.workspace }}` is the
          # RUNNER-side path and does not exist in the container — the upload step
          # below uses that form because it runs on the runner. Same directory, two
          # namespaces; passing the runner path here would write nowhere useful.
          session-dir: /github/workspace/second-opinion-sessions
      - name: Upload review session transcripts
        # NOT always(): that also fires on CANCELLATION, where an externally-killed pi
        # leaves its partial JSONL behind with no chance to scrub it — pushing a second
        # commit during a long pass does this, given cancel-in-progress above.
        # This guard is NOT the whole defence. Redaction lives in _finish_pass, which
        # only the normal returns reach, so an unhandled exception would ALSO leave a raw
        # transcript — and that surfaces as a failed job, not a cancelled one, so
        # !cancelled() would happily upload it. That hole is closed in run.py, where a
        # finally re-runs the scrub on every exit path; this guard covers the one case
        # that never re-enters Python at all.
        # It still captures everything worth having: a degraded pass exits 2, which is
        # failure(), and that is exactly when the transcript is wanted.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: second-opinion-sessions-${{ github.event.pull_request.number }}
          path: ${{ github.workspace }}/second-opinion-sessions
          include-hidden-files: true
          # `warn`, not `ignore`: a silently empty upload is how the downstream copy of
          # this step did nothing for a day while reporting success.
          if-no-files-found: warn
          # THIS REPO IS PUBLIC, so these artifacts are world-downloadable. The README's
          # Security section says to prefer private/EXPIRING artifacts on public repos,
          # because a prompt-injected agent could echo the key at runtime before the
          # redaction pass runs — redaction is a mitigation, not a sandbox. Taking the
          # expiring half of that advice: the diagnostic value of a transcript is
          # measured in days, so keeping it longer only grows the exposure window.
          # The residual exposure is accepted because the job is fork-gated (line 25),
          # so only same-repo PRs — authored by the maintainer — ever run the agent.
          # If this repo ever takes outside contributions, drop session-dir here.
          retention-days: 7
