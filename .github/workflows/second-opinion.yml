name: Second Opinion

# Dogfood: review our own PRs with this very reviewer, pinned to the released @v1.
# (To test unreleased reviewer changes, temporarily point this at @main or a branch.)
# Needs an OPENROUTER_API_KEY repo secret.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:                       # one run per PR; a new push cancels the old
  group: second-opinion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo, non-Dependabot PRs only. The fork guard keeps the key off untrusted
    # branches. The Dependabot guard is not about trust: Dependabot-triggered runs read
    # from GitHub's *separate* Dependabot secret store, so `secrets.OPENROUTER_API_KEY`
    # arrives empty and the job dies with "Missing required environment variable" — a
    # guaranteed red check on every dependency bump. Copying the key into that store
    # would fix the symptom by handing it to every automated bump run; a version-bump
    # diff is not worth a review anyway.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 30 > the 1500s pass timeout below plus image build/checkout, so the job never kills
    # a pass before the pass's own timeout can report it as degraded.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storkme/second-opinion@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          guidance-file: .github/review-guidance.md
          # This repo's own PRs outgrew the 900s default: an agentic pass on a large diff
          # with a reasoning model hits the wall and reds the check as degraded, with no
          # review — reviewer malfunction reported as if it were a verdict. Observed on
          # #21 (900s timeout) after two completed runs on the same PR burned 502k then
          # 923k tokens as the diff grew. A dogfood check that fails on its own medium
          # PRs teaches you to ignore it, which is the one thing this tripwire cannot
          # afford.
          pass-timeout-seconds: "1500"
